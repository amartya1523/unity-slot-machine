<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b1f; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* Keep the game at 16:9 and as large as the window allows. */
    #unity-canvas { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #0d0b1f; display: block; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ffd651; }
    #loading .title { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
    #bar { width: 280px; height: 10px; border-radius: 6px; background: #2a2553; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ff8a2a, #ffd651); transition: width .2s; }
    #error { color: #ff7b7b; max-width: 460px; text-align: center; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div class="title">LOADING SLOT MACHINE</div><div id="bar"><div id="fill"></div></div><div id="error"></div></div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };
    var canvas = document.querySelector("#unity-canvas");
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#error").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
